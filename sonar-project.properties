#
# SonarCloud configuration (honoured by automatic analysis).
#
# Purpose: encode the estate's reviewed positions on the rules SonarCloud
# cannot see estate context for, so the Quality Gate measures what this
# repo actually treats as defects. Every exclusion below cites its
# authority. Fixes over exclusions wherever a real fix exists: the
# workflow-level-permissions findings (S8264/S8233/S8234) and the
# Math.random fallback (S2245) were FIXED in code, not silenced here.
#
# ── Exclusions (rule × scope), each with its justification ─────────────────

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7

# S7637 "Use full commit SHA hash for this dependency" on .github/**
# Estate scheme: actions are pinned by version tag and mapped tag->SHA by
# .github/workflows/actions.lock (machine-generated by `gh actions-lock`,
# verified in CI by the governance "Actions lockfile verify" job).
# SonarCloud cannot see the lockfile; converting the pins to raw SHAs would
# fight the machine-generated scheme it exists to verify.
e1.ruleKey=githubactions:S7637
e1.resourceKey=.github/**

# S6505 / S8543 (npm lifecycle scripts, unlocked versions) on .github/** and
# S8564 (no lockfile) on worker/**
# The estate is npm-avoidant BY POLICY: no package-lock.json is tracked and
# worker installs use `npm install --no-audit --no-fund` (documented at the
# install steps in worker-ci.yml / worker-deploy.yml). Requiring a lockfile
# would contradict the recorded estate position these workflows document.
e2.ruleKey=githubactions:S6505
e2.resourceKey=.github/**
e3.ruleKey=githubactions:S8543
e3.resourceKey=.github/**
e4.ruleKey=text:S8564
e4.resourceKey=worker/**

# S6506 "Not enforcing HTTPS" (clear-text-redirect review) on .github/** and
# setup.sh — all flagged calls are `curl -fsSL`/`-sSfL` of FIXED https URLs
# (just.systems installer, github.com release assets, panic-attack binary).
# The -L is required (release asset URLs redirect); the scheme is pinned to
# https upstream of any redirect. Reviewed 2026-09-21: accepted as safe.
e5.ruleKey=githubactions:S6506
e5.resourceKey=.github/**
e6.ruleKey=shell:S6506
e6.resourceKey=setup.sh

# S5332 "Using clear-text protocols" on .github/** — boj-build.yml posts a
# no-secret build trigger to `http://boj-server.local:7700`, a LAN-only
# service on a .local host reached over the private network (TLS is not
# available there); the payload carries only public repo/branch names and
# the step is continue-on-error. Reviewed 2026-09-21: accepted as safe.
e7.ruleKey=githubactions:S5332
e7.resourceKey=.github/**
