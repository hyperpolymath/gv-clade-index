#
# SonarCloud configuration.
#
# Measured 2026-09-21: SonarCloud AUTOMATIC analysis honours only file-scope
# properties from this file (sonar.exclusions and friends). Rule-level
# `sonar.issue.ignore.multicriteria` below is therefore NOT what clears the
# Quality Gate on this project — the exclusions above that line are. The
# multicriteria block is kept for the day the estate moves to CI-based
# scanning, where rule-level ignores do apply.
#
# ── Automatic-analysis lever (honoured) ──────────────────────────────────────
# Exclude .github/** from Sonar analysis entirely. Justification: the estate
# lints CI workflow files with its own toolchain — `gh actions-lock` +
# governance "Actions lockfile verify" (tag->SHA pin integrity), the workflow
# security linter (duplicate-key detection), Hypatia workflow_audit rules —
# and the estate's schemes conflict with Sonar's generic GitHub-Actions rules
# by policy:
#   * S7637 (pin actions by full SHA): the estate pins by version tag and
#     maps tag->SHA in the machine-generated .github/workflows/actions.lock.
#     Raw-SHA pins would fight the lockfile scheme the gate exists to verify.
#   * S6505/S8543: npm-avoidant estate policy — no lockfile by design
#     (documented at the install steps in worker-ci.yml / worker-deploy.yml).
# Everything outside .github stays fully analysed — worker code, shell, and
# manifests keep real Sonar signal on purpose.
sonar.exclusions=.github/**/*

# ── CI-based-scanning lever (not honoured by automatic analysis) ─────────────
# Same policies expressed rule-by-rule, for the CI-based-scanning future.
# Kept here so the migration can simply switch the scanner on.
sonar.issue.ignore.multicriteria=e1,e2,e3
e1.ruleKey=githubactions:S7637
e1.resourceKey=.github/**
e2.ruleKey=githubactions:S6505
e2.resourceKey=.github/**
e3.ruleKey=githubactions:S8543
e3.resourceKey=.github/**
