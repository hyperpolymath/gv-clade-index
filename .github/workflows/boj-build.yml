# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# OPTIONAL: BoJ Server Build Trigger.
# Notifies a BoJ server that this repository was pushed, so its Casket
# (ssg-mcp) cartridge rebuilds the site. The endpoint comes from the
# BOJ_SERVER_URL secret or variable and must be https; the job is a no-op
# when it is unset, and a non-fatal skip when the server is unreachable.
# It used to POST in clear text to a hard-coded boj-server.local:7700, an
# mDNS name a GitHub-hosted runner cannot resolve, so the step always failed.
# This is the form standards' .github/workflows/boj-build.yml uses.
name: BoJ Server Build Trigger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs; the job only sends a notification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  trigger-boj:
    name: Trigger BoJ server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Trigger BoJ Server (Casket/ssg-mcp)
        # GitHub context goes through env, never into the script text.
        env:
          BOJ_URL: ${{ secrets.BOJ_SERVER_URL || vars.BOJ_SERVER_URL }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${BOJ_URL:-}" ]; then
            echo "BOJ_SERVER_URL not configured - skipping"
            exit 0
          fi
          case "$BOJ_URL" in
            https://*) ;;
            *)
              echo "::warning::BOJ_SERVER_URL is not an https URL - skipping (estate rule: HTTPS only)"
              exit 0
              ;;
          esac

          payload="$(jq -cn \
            --arg repo "$REPO_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg engine "casket" \
            '{repo: $repo, branch: $branch, engine: $engine}')"

          curl -sSf --proto '=https' --max-time 60 -X POST \
            "${BOJ_URL%/}/cartridges/ssg-mcp/invoke" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            || echo "::warning::BoJ server unreachable - skipping (non-fatal)"
