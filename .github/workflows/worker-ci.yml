# SPDX-License-Identifier: MPL-2.0
# Worker CI — lint, format, test and bundle the Cloudflare Worker.
# This is the gate that actually exercises the deliverable (the read API).
name: Worker CI

on:
  pull_request:
    branches: ['**']
    paths:
      - 'worker/**'
      - 'verisim/seed/**'
      - 'sync/**'
      - '.github/workflows/worker-ci.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Justfile'
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - 'verisim/seed/**'
      - 'sync/**'
      - '.github/workflows/worker-ci.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Justfile'

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: worker

jobs:
  build-test:
    name: Lint, format, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'

      # No tracked package-lock.json (npm-avoidant policy) → npm install, not npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Unit + contract tests (vitest)
        run: npm test

      - name: Bundle check (wrangler dry-run)
        run: npx wrangler deploy --dry-run

  registry:
    name: Registry integrity (seed ↔ worker/data)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Tooling (jq, uuidgen, shellcheck ship on ubuntu-latest; fail loudly otherwise)
        run: |
          for t in jq uuidgen shellcheck; do
            command -v "$t" >/dev/null || { echo "::error::missing tool $t"; exit 1; }
          done

      - name: Format check (trailing whitespace, final newline)
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if grep -nE '[[:space:]]+$' "$f"; then echo "trailing whitespace: $f"; bad=1; fi
            if [ -s "$f" ] && [ "$(tail -c1 "$f" | od -An -c | tr -d ' ')" != '\n' ]; then echo "no final newline: $f"; bad=1; fi
          done < <(git ls-files -z 'sync/*.sh' 'scripts/*.sh' 'tests/*.sh' Justfile 'verisim/seed/*.a2ml')
          [ "$bad" = 0 ]

      - name: Lint (shellcheck, sync/ scripts/ tests/)
        run: git ls-files -z 'sync/*.sh' 'scripts/*.sh' 'tests/*.sh' | xargs -0 shellcheck -S warning

      - name: Registry gate (parse round-trip, no drift, counts, uuid spot-check)
        run: bash scripts/check-registry.sh

      - name: Planted-failure test of the registry gate
        run: bash tests/check-registry-test.sh
