# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Worker CI — lint, format, test and bundle the Cloudflare Worker.
# This is the gate that actually exercises the deliverable (the read API).
name: Worker CI

on:
  pull_request:
    branches: ['**']
    paths:
      - 'worker/**'
      - 'verisim/seed/**'
      - 'sync/**'
      - '.github/workflows/worker-ci.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Justfile'
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - 'verisim/seed/**'
      - 'sync/**'
      - '.github/workflows/worker-ci.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Justfile'

defaults:
  run:
    working-directory: worker

jobs:
  build-test:
    name: Lint, format, test, bundle
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'

      # No tracked package-lock.json (npm-avoidant policy) → npm install, not npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Unit + contract tests (vitest)
        run: npm test

      - name: Bundle check (wrangler dry-run)
        run: npx wrangler deploy --dry-run

  registry:
    name: Registry integrity (seed ↔ worker/data)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # sync/uuid-v8.sh runs standards' shared UUIDv8 generator (ADR-008) under
      # Bun, the estate's tier-1 runtime, at the estate pin 1.4.2.
      - name: Install verified Bun 1.4.2
        run: |
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip \
            --output "$RUNNER_TEMP/bun.zip"
          echo "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"

      - name: Tooling (jq, uuidgen, shellcheck ship on ubuntu-latest; fail loudly otherwise)
        run: |
          for t in jq uuidgen shellcheck bun; do
            command -v "$t" >/dev/null || { echo "::error::missing tool $t"; exit 1; }
          done

      - name: Format check (trailing whitespace, final newline)
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if grep -nE '[[:space:]]+$' "$f"; then echo "trailing whitespace: $f"; bad=1; fi
            if [ -s "$f" ] && [ "$(tail -c1 "$f" | od -An -c | tr -d ' ')" != '\n' ]; then echo "no final newline: $f"; bad=1; fi
          done < <(git ls-files -z 'sync/*.sh' 'scripts/*.sh' 'tests/*.sh' Justfile 'verisim/seed/*.a2ml')
          [ "$bad" = 0 ]

      - name: Lint (shellcheck, sync/ scripts/ tests/)
        run: git ls-files -z 'sync/*.sh' 'scripts/*.sh' 'tests/*.sh' | xargs -0 shellcheck -S warning

      - name: Registry gate (parse round-trip, no drift, counts, uuid v5 + uuid_v8 identities)
        run: bash scripts/check-registry.sh

      - name: Planted-failure test of the registry gate
        run: bash tests/check-registry-test.sh
